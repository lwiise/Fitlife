name: Secret scan

# .gitleaks.toml existed for months with nothing running it — a committed key
# would have passed CI and auto-deployed. gitleaks-action scans the PUSHED
# RANGE on push and the PR's commits on pull_request (verified on the first
# run: "17 commits scanned"), so those two triggers guard every change going
# forward. The WHOLE history is only scanned on schedule / workflow_dispatch —
# hence the weekly run and the manual trigger, which is how the full-history
# baseline was established.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 Asia/Riyadh (03:00 UTC), beside Dependabot's slot.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
