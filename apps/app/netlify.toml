# Netlify config for the Fit Life SaaS app
# Live at: https://fitlife-app-mvp.netlify.app/
# Custom domain (e.g., app.fitlife.com) to be added later.
#
# Build approach:
#   - base = "apps/app" so Netlify scopes the deploy to this app
#   - pnpm -w install installs at the workspace root regardless of cwd
#     (pnpm -w looks UP for pnpm-workspace.yaml)
#   - pnpm --filter @fitlife/app build builds only this app's package
#
# This avoids relying on $NETLIFY_REPO_BASE_DIR (which doesn't exist
# in Netlify's build environment).

[build]
  base = "apps/app"
  # Build on EVERY push. Netlify otherwise skips a build when nothing under the base
  # dir (apps/app) changed — but @fitlife/plan-engine and @fitlife/config live
  # OUTSIDE base yet are compiled into the app, so package-only fixes were silently
  # skipped ("Canceled build due to no content change") and never reached prod until
  # an unrelated apps/app commit rebuilt main HEAD. /bin/false always exits non-zero,
  # which tells Netlify "do not ignore" → the build always runs.
  ignore = "/bin/false"
  command = "corepack enable && pnpm -w install --frozen-lockfile && pnpm --filter @fitlife/app build"
  # publish is relative to base — Netlify joins them, so ".next" resolves
  # to /opt/build/repo/apps/app/.next. Using "apps/app/.next" here would
  # double the prefix (see deploy 2496820 — failed at apps/app/apps/app/.next).
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PRIVATE_TARGET = "server"
  # ⚠️ TEMPORARY — PRE-LAUNCH TESTING ONLY. Unlocks every paid capability for
  # everyone: no subscription required, unlimited household members, unlimited
  # plan generations. See apps/app/src/lib/subscription/freeAccess.ts for the
  # full list of what it changes and what it deliberately leaves alone (the
  # LemonSqueezy checkout + webhooks stay live, so payments remain testable).
  #
  # TO RESTORE PAID ACCESS: delete this single line and redeploy. Nothing else
  # needs unwinding — every bypass reads this one variable, and the code paths
  # are unmodified beneath it.
  #
  # COST WARNING: the weekly plan-generation limits are off while this is on,
  # and every generation is a paid Anthropic call.
  #
  # Set HERE rather than in the Netlify UI so that turning payments back on is a
  # reviewable one-line revert in git, not an undocumented dashboard edit that
  # outlives whoever made it. Next.js inlines NEXT_PUBLIC_* at build time, so a
  # redeploy is required either way.
  NEXT_PUBLIC_FREE_ACCESS_MODE = "1"

# Custom Netlify functions (e.g. the plan-generation background worker) are
# bundled with esbuild, which inlines the relatively-imported @fitlife/plan-engine
# source into the artifact (avoids pnpm workspace-symlink resolution issues).
[functions]
  node_bundler = "esbuild"
  # Explicit rather than relying on the default. This is the default location
  # (resolved relative to `base`, so apps/app/netlify/functions), but a site whose
  # UI has a Functions directory configured would silently override the implicit
  # case — and a background function that is not deployed does not 404. The URL
  # falls through to the Next handler, which redirects, which fetch follows to a
  # 200, so the app read "enqueued" for a worker that never existed.
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# API routes must not be cached
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
